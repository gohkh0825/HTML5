<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Google TV 风格首页</title>

  <!-- ES5 兼容引导层：防旧版 Android WebView 语法报错白屏 -->
  <script>
    (function () {
      var docEl = document.documentElement;
      if (window.fongmiBridge || window.fm || window.fongmi) {
        docEl.classList.add("fm-native");
      }
      if (!Array.from) {
        Array.from = function (list) { return Array.prototype.slice.call(list || []); };
      }
      if (!Array.prototype.includes) {
        Array.prototype.includes = function (item) { return this.indexOf(item) !== -1; };
      }
      if (!String.prototype.includes) {
        String.prototype.includes = function (str) { return this.indexOf(str) !== -1; };
      }
      if (typeof NodeList !== "undefined" && NodeList.prototype && !NodeList.prototype.forEach) {
        NodeList.prototype.forEach = Array.prototype.forEach;
      }
      if (typeof Element !== "undefined" && !Element.prototype.replaceChildren) {
        Element.prototype.replaceChildren = function () {
          while (this.firstChild) this.removeChild(this.firstChild);
          for (var i = 0; i < arguments.length; i++) {
            var node = arguments[i];
            this.appendChild(typeof node === "string" ? document.createTextNode(node) : node);
          }
        };
      }
      if (typeof Promise !== "undefined" && Promise.prototype && !Promise.prototype.finally) {
        Promise.prototype.finally = function (cb) {
          var P = this.constructor;
          return this.then(
            function (val) { return P.resolve(cb()).then(function () { return val; }); },
            function (err) { return P.resolve(cb()).then(function () { throw err; }); }
          );
        };
      }

      // 特性检测降级类
      try {
        var tf = document.createElement("div");
        tf.style.display = "flex";
        tf.style.flexDirection = "column";
        tf.style.gap = "10px";
        tf.style.position = "absolute";
        tf.style.visibility = "hidden";
        tf.appendChild(document.createElement("div"));
        tf.appendChild(document.createElement("div"));
        document.head.appendChild(tf);
        if (tf.scrollHeight < 10) docEl.classList.add("no-layout-gap");
        document.head.removeChild(tf);
      } catch (e) { docEl.classList.add("no-layout-gap"); }

      try {
        var tr = document.createElement("div");
        tr.style.width = "100px";
        tr.style.aspectRatio = "16 / 9";
        tr.style.position = "absolute";
        tr.style.visibility = "hidden";
        document.head.appendChild(tr);
        if (tr.offsetHeight <= 40 || tr.offsetHeight >= 70) docEl.classList.add("no-aspect-ratio");
        document.head.removeChild(tr);
      } catch (e) { docEl.classList.add("no-aspect-ratio"); }
    })();
  </script>

  <style>
    :root {
      --panel-rgb: 22, 26, 33;
      --panel: rgba(var(--panel-rgb), 0.65);
      --panel-soft: rgba(var(--panel-rgb), 0.45);
      --panel-pill: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-dim: rgba(248, 250, 252, 0.72);
      --accent: #a8c7fa; /* Google TV 标志性浅蓝强调色 */
      --safe-top: var(--fm-safe-top, 0px);
      --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
      --safe-bottom: var(--fm-safe-bottom, 0px);
      --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
      --safe-left: var(--fm-safe-left, 0px);
      --safe-left: max(var(--fm-safe-left, 0px), env(safe-area-inset-left, 0px));
      --safe-right: var(--fm-safe-right, 0px);
      --safe-right: max(var(--fm-safe-right, 0px), env(safe-area-inset-right, 0px));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: transparent;
      color: var(--text);
      font-family: "Google Sans", "Roboto", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    html:not(.fm-native),
    html:not(.fm-native) body {
      background: #0f1115;
    }

    /* 背景暗角渐层：让壁纸透出的同时保证左侧与底部文字高对比度 */
    .ambient-scrim {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(12, 14, 18, 0.58) 0%,
        rgba(12, 14, 18, 0.25) 42%,
        rgba(12, 14, 18, 0.86) 100%
      );
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: var(--fm-web-height, 100vh);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: calc(var(--safe-top) + 16px);
      padding-bottom: calc(var(--safe-bottom) + 24px);
      padding-left: calc(var(--safe-left) + 20px);
      padding-right: calc(var(--safe-right) + 20px);
    }

    html.tv-mode .app {
      padding-top: 28px;
      padding-bottom: 32px;
      padding-left: 52px;
      padding-right: 52px;
    }

    /* 1. Google TV 顶部药丸导航栏 */
    .gtv-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .gtv-nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 2px;
    }

    .gtv-nav-group::-webkit-scrollbar {
      display: none;
    }

    html.no-layout-gap .gtv-nav-group > * + * {
      margin-left: 8px;
    }

    .gtv-pill {
      appearance: none;
      border: 2px solid transparent;
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      outline: none;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
      transition: background-color 0.14s ease, color 0.14s ease, transform 0.14s ease;
    }

    html.tv-mode .gtv-pill {
      font-size: 18px;
      padding: 10px 22px;
      min-height: 46px;
    }

    .gtv-pill.active {
      background: var(--panel-pill);
      color: var(--text);
    }

    /* Google TV 标志性纯白高对比焦点胶囊 */
    .gtv-pill:focus,
    .gtv-pill:active {
      background: #f8fafc;
      color: #0f1115;
      transform: scale(1.04);
    }

    .gtv-icon-btn {
      padding: 8px 12px;
    }

    html.tv-mode .gtv-icon-btn {
      padding: 10px 14px;
    }

    .gtv-status-badge {
      font-size: 12px;
      color: var(--text-dim);
      background: var(--panel-soft);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 999px;
      white-space: nowrap;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    html.tv-mode .gtv-status-badge {
      font-size: 15px;
      padding: 8px 18px;
    }

    /* 内联展开搜索栏 */
    .gtv-search-bar {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(18, 22, 29, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 6px 8px 6px 20px;
      margin-bottom: 18px;
      max-width: 680px;
    }

    .gtv-search-bar.open {
      display: flex;
    }

    .gtv-search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      outline: none;
      padding: 8px 4px;
    }

    html.tv-mode .gtv-search-input {
      font-size: 19px;
    }

    .gtv-search-input::placeholder {
      color: var(--text-dim);
    }

    /* 2. Hero 焦点舞台区 */
    .gtv-hero {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 210px;
      max-width: 680px;
      padding: 16px 4px 24px 4px;
    }

    html.tv-mode .gtv-hero {
      min-height: 250px;
      padding: 20px 4px 28px 4px;
    }

    .hero-eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    html.tv-mode .hero-eyebrow {
      font-size: 15px;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin: 0 0 10px 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    html.tv-mode .hero-title {
      font-size: 40px;
    }

    .hero-meta {
      font-size: 14px;
      color: var(--text-dim);
      margin-bottom: 18px;
      line-height: 1.4;
    }

    html.tv-mode .hero-meta {
      font-size: 18px;
      margin-bottom: 22px;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    html.no-layout-gap .hero-actions > * + * {
      margin-left: 12px;
    }

    .hero-btn {
      appearance: none;
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.16);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 22px;
      border-radius: 999px;
      cursor: pointer;
      outline: none;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.14s ease, background-color 0.14s ease;
    }

    html.tv-mode .hero-btn {
      font-size: 18px;
      padding: 12px 28px;
      min-height: 50px;
    }

    .hero-btn.primary {
      background: rgba(168, 199, 250, 0.28);
      color: #e8f0fe;
    }

    .hero-btn:focus,
    .hero-btn:active {
      background: #f8fafc;
      color: #0f1115;
      transform: scale(1.04);
    }

    /* 3. 继续观看横向宽屏轨道 (Google TV 16:9 风格) */
    .gtv-row {
      margin-top: 8px;
    }

    .row-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    html.tv-mode .row-title {
      font-size: 21px;
      margin-bottom: 14px;
    }

    .gtv-rail {
      display: flex;
      overflow-x: auto;
      gap: 16px;
      padding: 6px 4px 14px 4px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .gtv-rail::-webkit-scrollbar {
      display: none;
    }

    html.no-layout-gap .gtv-rail > * + * {
      margin-left: 16px;
    }

    .gtv-card {
      flex: 0 0 210px;
      width: 210px;
      cursor: pointer;
      outline: none;
      contain: layout style;
      transition: transform 0.14s ease;
    }

    html.tv-mode .gtv-card {
      flex: 0 0 264px;
      width: 264px;
    }

    .gtv-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel);
      border: 3px solid transparent;
      transition: border-color 0.14s ease;
    }

    html.no-aspect-ratio .gtv-thumb {
      height: 0;
      padding-top: 56.25%;
    }

    .gtv-card:focus {
      transform: translateY(-2px) scale(1.04);
    }

    .gtv-card:focus .gtv-thumb {
      border-color: #ffffff;
    }

    .gtv-thumb-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.45;
      transform: scale(1.12);
    }

    .gtv-thumb-poster {
      position: absolute;
      top: 8px;
      left: 10px;
      bottom: 10px;
      width: auto;
      aspect-ratio: 2 / 3;
      border-radius: 6px;
      object-fit: cover;
      background: rgba(0, 0, 0, 0.4);
    }

    .gtv-thumb-overlay {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(90deg, rgba(15, 17, 21, 0.35) 0%, rgba(15, 17, 21, 0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 12px 12px 76px;
    }

    html.tv-mode .gtv-thumb-overlay {
      padding-left: 94px;
    }

    .gtv-thumb-overlay.no-poster {
      padding-left: 14px;
    }

    .gtv-card-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.25;
    }

    html.tv-mode .gtv-card-name {
      font-size: 17px;
    }

    .gtv-card-ep {
      font-size: 11px;
      color: var(--accent);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    html.tv-mode .gtv-card-ep {
      font-size: 14px;
    }

    .gtv-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.22);
    }

    .gtv-progress-fill {
      height: 100%;
      background: #ffffff;
    }

    /* 快捷功能卡片（无观看记录或位于轨道末尾） */
    .gtv-shortcut-card {
      flex: 0 0 160px;
      width: 160px;
      aspect-ratio: 16 / 9;
      background: var(--panel);
      border: 3px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      color: var(--text);
      padding: 12px;
      text-align: center;
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
    }

    html.tv-mode .gtv-shortcut-card {
      flex: 0 0 200px;
      width: 200px;
    }

    .gtv-shortcut-card:focus {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px) scale(1.04);
    }

    .shortcut-label {
      font-size: 14px;
      font-weight: 600;
    }

    html.tv-mode .shortcut-label {
      font-size: 17px;
    }

    @media (max-width: 640px) {
      .gtv-status-badge {
        display: none;
      }
      .hero-title {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-scrim"></div>

  <div class="app">
    <!-- 顶部药丸导航 -->
    <div>
      <header class="gtv-topbar">
        <nav class="gtv-nav-group" aria-label="主导航">
          <button type="button" class="gtv-pill gtv-icon-btn focusable" id="navSearch" aria-label="搜索">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <button type="button" class="gtv-pill active focusable" id="navHome">为你推荐</button>
          <button type="button" class="gtv-pill focusable" id="navVod">点播库</button>
          <button type="button" class="gtv-pill focusable" id="navLive">直播</button>
          <button type="button" class="gtv-pill focusable" id="navKeep">媒体库</button>
          <button type="button" class="gtv-pill focusable" id="navSetting">设置</button>
        </nav>
        <div class="gtv-status-badge" id="configBadge">正在连接...</div>
      </header>

      <!-- 按搜索展开的药丸输入框 -->
      <div class="gtv-search-bar" id="searchBar">
        <input
          type="text"
          class="gtv-search-input focusable"
          id="searchInput"
          placeholder="搜索片名，或粘贴网盘 / 磁力 / 视频直链..."
          autocomplete="off"
        />
        <button type="button" class="gtv-pill active focusable" id="btnSearchGo">搜索 / 播放</button>
      </div>
    </div>

    <!-- 中部沉浸式 Hero 焦点区 -->
    <section class="gtv-hero" aria-live="polite">
      <div class="hero-eyebrow" id="heroEyebrow">GOOGLE TV · 极简启动台</div>
      <h1 class="hero-title" id="heroTitle">准备好开始观影了吗？</h1>
      <div class="hero-meta" id="heroMeta">移动焦点预览最近观看进度，或点击下方按钮进入点播与直播</div>
      <div class="hero-actions">
        <button type="button" class="hero-btn primary focusable" id="heroPrimaryBtn">
          <span>▶ 立即播放</span>
        </button>
        <button type="button" class="hero-btn focusable" id="heroSecondaryBtn">
          <span>切换点播源</span>
        </button>
      </div>
    </section>

    <!-- 底部继续观看横向轨道 -->
    <section class="gtv-row">
      <div class="row-title" id="rowTitle">继续观看</div>
      <div class="gtv-rail" id="gtvRail"></div>
    </section>
  </div>

  <!-- 业务代码严格遵循 ES2017 基线 -->
  <script>
    (function () {
      "use strict";

      var state = {
        isTv: false,
        historyItems: [],
        activeHeroItem: null,
        scrollRaf: 0
      };

      // 1. 设备形态识别
      function detectClientMode() {
        var client = window.fongmiClient || {};
        var isTv = false;
        if (typeof client.isLeanback === "boolean") {
          isTv = client.isLeanback;
        } else if (client.mode === "leanback") {
          isTv = true;
        } else {
          var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
          isTv = window.innerWidth >= 960 && !coarse;
        }
        state.isTv = isTv;
        document.documentElement.classList.toggle("tv-mode", isTv);
        document.documentElement.classList.toggle("mobile-mode", !isTv);

        var input = document.getElementById("searchInput");
        if (input && isTv) {
          input.setAttribute("readonly", "readonly");
        }
      }

      // 2. 等待 SDK
      function whenFm() {
        if (window.fm) return Promise.resolve(window.fm);
        return new Promise(function (resolve) {
          var timer = setTimeout(function () { resolve(window.fm || null); }, 1500);
          window.addEventListener("fmsdk", function () {
            clearTimeout(timer);
            resolve(window.fm);
          }, { once: true });
        });
      }

      function parseHistoryKey(key) {
        if (!key || typeof key !== "string") return { siteKey: "", vodId: "" };
        var parts = key.split("@@@");
        return { siteKey: parts[0] || "", vodId: parts[1] || "" };
      }

      // 3. 格式化毫秒进度
      function formatDuration(ms) {
        if (!ms || ms <= 0) return "";
        var totalSec = Math.floor(ms / 1000);
        var min = Math.floor(totalSec / 60);
        var hour = Math.floor(min / 60);
        min = min % 60;
        if (hour > 0) return hour + " 小时 " + min + " 分钟";
        return min + " 分钟";
      }

      // 4. 更新 Hero 舞台信息（焦点联动核心）
      function updateHero(item) {
        var eyebrow = document.getElementById("heroEyebrow");
        var title = document.getElementById("heroTitle");
        var meta = document.getElementById("heroMeta");
        var primaryBtn = document.getElementById("heroPrimaryBtn");

        state.activeHeroItem = item || null;

        if (!item) {
          eyebrow.textContent = "GOOGLE TV · 极简启动台";
          title.textContent = "发现精彩影视与直播";
          meta.textContent = "支持聚合搜索、网盘链接直达与多端历史续播";
          primaryBtn.textContent = "打开点播分类";
          return;
        }

        eyebrow.textContent = "继续观看 · " + (item.vodFlag || "最近记录");
        title.textContent = item.vodName || "未知影片";

        var metaParts = [];
        if (item.vodRemarks) metaParts.push(item.vodRemarks);
        if (item.position > 0 && item.duration > 0) {
          var remain = item.duration - item.position;
          if (remain > 60000) {
            metaParts.push("还剩 " + formatDuration(remain));
          } else {
            metaParts.push("即将看完");
          }
        }
        meta.textContent = metaParts.length > 0 ? metaParts.join("  ·  ") : "点击继续从上次位置播放";
        primaryBtn.textContent = "▶ 继续观看";
      }

      // 5. 识别链接类型（搜索词 / 网盘 / 磁力 / 直链）
      function detectLinkType(text) {
        var lower = text.toLowerCase();
        if (lower.indexOf("magnet:?") === 0) return "magnet";
        if (lower.indexOf("ed2k://") === 0) return "ed2k";
        if (lower.indexOf("thunder://") === 0) return "thunder";
        if (lower.indexOf("jianpian:") === 0 || lower.indexOf("tvbox-xg:") === 0) return "jianpian";
        if (lower.indexOf("pan.quark.cn") !== -1) return "quark";
        if (lower.indexOf("alipan.com") !== -1 || lower.indexOf("aliyundrive.com") !== -1) return "aliyun";
        if (lower.indexOf("pan.baidu.com") !== -1) return "baidu";
        if (lower.indexOf("drive.uc.cn") !== -1) return "uc";
        if (lower.indexOf("cloud.189.cn") !== -1) return "tianyi";
        if (lower.indexOf("pan.xunlei.com") !== -1) return "xunlei";
        if (lower.indexOf("123pan.com") !== -1 || lower.indexOf("123pan.cn") !== -1) return "123";
        if (lower.indexOf("115.com") !== -1 || lower.indexOf("115cdn.com") !== -1) return "115";
        if (lower.indexOf("yun.139.com") !== -1 || lower.indexOf("caiyun.139.com") !== -1) return "mobile";
        if (/^https?:\/\//i.test(text)) {
          if (/\.(mp4|mkv|m3u8|mpd|flv|mp3|ts)(\?|$)/i.test(text)) return "direct";
          return "http";
        }
        return "keyword";
      }

      async function handleSearchSubmit() {
        var input = document.getElementById("searchInput");
        var raw = input ? input.value.trim() : "";
        if (!raw) return;

        var fm = await whenFm();
        if (!fm) return;
        var kind = detectLinkType(raw);

        try {
          if (kind === "keyword") {
            await fm.search(raw, { direct: true });
          } else if (kind === "direct") {
            var opts = {};
            if (/\.m3u8(\?|$)/i.test(raw)) opts.format = "hls";
            if (/\.mpd(\?|$)/i.test(raw)) opts.format = "dash";
            await fm.play(raw, raw, opts);
          } else {
            await fm.pan.play({ type: kind, url: raw, title: raw });
          }
        } catch (e) {
          if (fm.ext && fm.ext.toast) fm.ext.toast("操作失败");
        }
      }

      async function playHistoryItem(item) {
        var fm = await whenFm();
        if (!fm) return;
        if (!item) {
          await fm.openVod();
          return;
        }
        var parsed = parseHistoryKey(item.key);
        try {
          if (parsed.siteKey && parsed.vodId) {
            await fm.vod(parsed.siteKey, parsed.vodId, item.vodName || "", item.vodPic || "");
          } else if (item.episodeUrl) {
            await fm.play(item.episodeUrl, item.vodName || "", { pic: item.vodPic || "" });
          } else if (item.vodName) {
            await fm.search(item.vodName, { direct: true, pic: item.vodPic || "" });
          }
        } catch (e) {
          if (fm.ext && fm.ext.toast) fm.ext.toast("打开失败");
        }
      }

      // 6. 渲染 Google TV 16:9 横向卡片轨道
      function renderRail(items, fm) {
        var rail = document.getElementById("gtvRail");
        var rowTitle = document.getElementById("rowTitle");
        var frag = document.createDocumentFragment();

        if (items && items.length > 0) {
          rowTitle.textContent = "继续观看";
          updateHero(items[0]);

          for (var i = 0; i < items.length; i++) {
            (function (item, idx) {
              var card = document.createElement("div");
              card.className = "gtv-card focusable";
              card.setAttribute("tabindex", "0");
              card.setAttribute("role", "button");

              var thumb = document.createElement("div");
              thumb.className = "gtv-thumb";

              var hasPic = Boolean(item.vodPic);
              var resolvedPic = hasPic ? (fm && fm.res ? fm.res(item.vodPic) : item.vodPic) : "";

              if (hasPic) {
                var bgImg = document.createElement("img");
                bgImg.className = "gtv-thumb-bg";
                bgImg.setAttribute("loading", idx < 4 ? "eager" : "lazy");
                bgImg.src = resolvedPic;
                bgImg.onerror = function () { this.style.display = "none"; };
                thumb.appendChild(bgImg);

                var posterImg = document.createElement("img");
                posterImg.className = "gtv-thumb-poster";
                posterImg.setAttribute("loading", idx < 4 ? "eager" : "lazy");
                posterImg.src = resolvedPic;
                posterImg.onerror = function () {
                  this.style.display = "none";
                  overlay.classList.add("no-poster");
                };
                thumb.appendChild(posterImg);
              }

              var overlay = document.createElement("div");
              overlay.className = "gtv-thumb-overlay" + (hasPic ? "" : " no-poster");

              var nameEl = document.createElement("div");
              nameEl.className = "gtv-card-name";
              nameEl.textContent = item.vodName || "未知影片";

              var epEl = document.createElement("div");
              epEl.className = "gtv-card-ep";
              epEl.textContent = item.vodRemarks || item.vodFlag || "点击继续";

              overlay.appendChild(nameEl);
              overlay.appendChild(epEl);
              thumb.appendChild(overlay);

              if (item.position > 0 && item.duration > 0) {
                var pct = Math.min(100, Math.max(3, Math.round((item.position / item.duration) * 100)));
                var bar = document.createElement("div");
                bar.className = "gtv-progress";
                var fill = document.createElement("div");
                fill.className = "gtv-progress-fill";
                fill.style.width = pct + "%";
                bar.appendChild(fill);
                thumb.appendChild(bar);
              }

              card.appendChild(thumb);

              // 焦点与悬停同步更新上方 Hero 舞台
              card.addEventListener("focus", function () { updateHero(item); });
              card.addEventListener("mouseenter", function () { updateHero(item); });
              card.addEventListener("click", function () { playHistoryItem(item); });

              frag.appendChild(card);
            })(items[i], i);
          }
        } else {
          rowTitle.textContent = "快速开始";
          updateHero(null);
        }

        // 轨道末尾追加快捷功能卡片
        var shortcuts = [
          { label: "浏览全部站点", action: "vod" },
          { label: "进入电视直播", action: "live" },
          { label: "我的收藏夹", action: "keep" }
        ];

        for (var j = 0; j < shortcuts.length; j++) {
          (function (sc) {
            var scCard = document.createElement("div");
            scCard.className = "gtv-shortcut-card focusable";
            scCard.setAttribute("tabindex", "0");
            scCard.setAttribute("role", "button");

            var lbl = document.createElement("div");
            lbl.className = "shortcut-label";
            lbl.textContent = sc.label;
            scCard.appendChild(lbl);

            scCard.addEventListener("click", function () {
              whenFm().then(function (fm) {
                if (!fm) return;
                if (sc.action === "vod") fm.openVod();
                else if (sc.action === "live") fm.openLive();
                else if (sc.action === "keep") fm.openKeep();
              });
            });

            frag.appendChild(scCard);
          })(shortcuts[j]);
        }

        rail.replaceChildren(frag);
      }

      // 7. 加载数据
      async function initData() {
        var fm = await whenFm();
        var badge = document.getElementById("configBadge");

        if (!fm) {
          badge.textContent = "浏览器预览";
          renderRail([], null);
          return;
        }

        Promise.all([
          fm.config().catch(function () { return {}; }),
          fm.history().catch(function () { return []; })
        ]).then(function (res) {
          var cfg = res[0] || {};
          var hist = Array.isArray(res[1]) ? res[1] : [];

          badge.textContent = cfg.desc || "已连接";

          var valid = hist.filter(function (item) {
            if (!item || !item.vodName) return false;
            if (typeof item.position === "number" && item.position > 0 && item.position < 15000) return false;
            return true;
          }).slice(0, 14);

          state.historyItems = valid;
          renderRail(valid, fm);

          // TV 端数据加载完成后，默认焦点落在第一张卡片或顶部“为你推荐”
          if (state.isTv) {
            var firstCard = document.querySelector(".gtv-card");
            if (firstCard) {
              firstCard.focus({ preventScroll: true });
            } else {
              document.getElementById("navHome").focus({ preventScroll: true });
            }
          }
        });
      }

      // 8. 遥控器焦点平滑滚动与导航
      function focusTarget(el) {
        if (!el) return;
        el.focus({ preventScroll: true });
        if (state.scrollRaf) cancelAnimationFrame(state.scrollRaf);
        state.scrollRaf = requestAnimationFrame(function () {
          if (el.scrollIntoView) el.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
      }

      function setupRemote() {
        document.addEventListener("keydown", function (e) {
          var key = e.key || "";
          var code = e.keyCode || 0;
          var active = document.activeElement;
          var searchBar = document.getElementById("searchBar");

          // 确认键
          if (key === "Enter" || key === "Select" || code === 13 || code === 23) {
            if (active && active.id === "searchInput") {
              if (active.hasAttribute("readonly")) {
                e.preventDefault();
                active.removeAttribute("readonly");
                active.focus();
              } else {
                e.preventDefault();
                handleSearchSubmit();
              }
              return;
            }
            if (active && active.classList && (active.classList.contains("gtv-card") || active.classList.contains("gtv-shortcut-card"))) {
              e.preventDefault();
              active.click();
              return;
            }
          }

          // 返回键优先关闭搜索栏或退出编辑态
          if (key === "Escape" || key === "Backspace" || code === 4 || code === 27) {
            if (active && active.id === "searchInput" && !active.hasAttribute("readonly") && state.isTv) {
              e.preventDefault();
              active.setAttribute("readonly", "readonly");
              return;
            }
            if (searchBar.classList.contains("open")) {
              e.preventDefault();
              searchBar.classList.remove("open");
              focusTarget(document.getElementById("navSearch"));
              return;
            }
          }

          if (!state.isTv) return;
          if (active && active.id === "searchInput" && !active.hasAttribute("readonly")) return;

          var isUp = key === "ArrowUp" || code === 38;
          var isDown = key === "ArrowDown" || code === 40;
          var isLeft = key === "ArrowLeft" || code === 37;
          var isRight = key === "ArrowRight" || code === 39;
          if (!isUp && !isDown && !isLeft && !isRight) return;

          // 轨道内快速左右移动
          if ((isLeft || isRight) && active && (active.classList.contains("gtv-card") || active.classList.contains("gtv-shortcut-card"))) {
            var sib = isRight ? active.nextElementSibling : active.previousElementSibling;
            if (sib) {
              e.preventDefault();
              focusTarget(sib);
              return;
            }
          }

          // 顶部导航栏快速左右移动
          if ((isLeft || isRight) && active && active.classList.contains("gtv-pill") && active.parentElement.classList.contains("gtv-nav-group")) {
            var navSib = isRight ? active.nextElementSibling : active.previousElementSibling;
            if (navSib) {
              e.preventDefault();
              focusTarget(navSib);
              return;
            }
          }

          var focusables = Array.from(document.querySelectorAll(".focusable")).filter(function (el) {
            return el.offsetParent !== null;
          });
          if (focusables.length === 0) return;

          if (!active || focusables.indexOf(active) === -1) {
            e.preventDefault();
            focusTarget(focusables[0]);
            return;
          }

          var rect = active.getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          var best = null;
          var bestScore = Infinity;

          for (var i = 0; i < focusables.length; i++) {
            var cand = focusables[i];
            if (cand === active) continue;
            var r = cand.getBoundingClientRect();
            var tx = r.left + r.width / 2;
            var ty = r.top + r.height / 2;
            var dx = tx - cx;
            var dy = ty - cy;

            if (isUp && dy >= -8) continue;
            if (isDown && dy <= 8) continue;
            if (isLeft && dx >= -8) continue;
            if (isRight && dx <= 8) continue;

            var primary = (isUp || isDown) ? Math.abs(dy) : Math.abs(dx);
            var secondary = (isUp || isDown) ? Math.abs(dx) : Math.abs(dy);
            var score = primary + secondary * 2.5;
            if (score < bestScore) {
              bestScore = score;
              best = cand;
            }
          }

          if (best) {
            e.preventDefault();
            focusTarget(best);
          }
        });
      }

      // 9. 事件绑定
      function bindEvents() {
        var searchBar = document.getElementById("searchBar");
        var searchInput = document.getElementById("searchInput");

        document.getElementById("navSearch").addEventListener("click", function () {
          var isOpen = searchBar.classList.toggle("open");
          if (isOpen) {
            if (!state.isTv) searchInput.removeAttribute("readonly");
            focusTarget(searchInput);
          }
        });

        searchInput.addEventListener("click", function () {
          if (this.hasAttribute("readonly")) {
            this.removeAttribute("readonly");
            this.focus();
          }
        });

        searchInput.addEventListener("blur", function () {
          if (state.isTv) this.setAttribute("readonly", "readonly");
        });

        document.getElementById("btnSearchGo").addEventListener("click", handleSearchSubmit);

        document.getElementById("navHome").addEventListener("click", function () {
          initData();
        });
        document.getElementById("navVod").addEventListener("click", function () {
          whenFm().then(function (fm) { if (fm) fm.openVod(); });
        });
        document.getElementById("navLive").addEventListener("click", function () {
          whenFm().then(function (fm) { if (fm) fm.openLive(); });
        });
        document.getElementById("navKeep").addEventListener("click", function () {
          whenFm().then(function (fm) { if (fm) fm.openKeep(); });
        });
        document.getElementById("navSetting").addEventListener("click", function () {
          whenFm().then(function (fm) { if (fm) fm.openSetting(); });
        });

        document.getElementById("heroPrimaryBtn").addEventListener("click", function () {
          playHistoryItem(state.activeHeroItem);
        });
        document.getElementById("heroSecondaryBtn").addEventListener("click", function () {
          whenFm().then(function (fm) { if (fm) fm.openVod(); });
        });

        window.addEventListener("fmresume", initData);
        window.addEventListener("resize", detectClientMode);
      }

      detectClientMode();
      setupRemote();
      bindEvents();
      initData();
    })();
  </script>
</body>
